<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Pair (PoC)</title>
    <style>
      body { background: rgba(0,0,0,0); margin: 0; }
      #avatar { width: 100%; height: 100%; display:flex; align-items:center; justify-content:center; }
      #btn { position: absolute; right: 8px; top: 8px; background: rgba(255,255,255,0.12); padding: 6px; border-radius:6px; cursor:pointer; }
    </style>
  </head>
  <body>
    <div id="avatar">👋 Pair</div>
    <div id="btn" onclick="toggle()">👁️</div>
    <script>
      const { ipcRenderer } = require('electron');
      function toggle(){ ipcRenderer.invoke('toggle-visibility'); }
    </script>
  </body>
</html>
